<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PeerApp — Watch Together</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="watch.css" />
</head>
<body>
  <div id="watch-container">
    <!-- Video Player Section -->
    <div id="video-player-section">
      <div id="player-container">
        <div id="video-placeholder">
          <div class="placeholder-content">
            <span class="emoji">🎬</span>
            <p>Paste a YouTube or Vimeo URL to start watching together</p>
            <small>Example: https://www.youtube.com/watch?v=dQw4w9WgXcQ</small>
          </div>
        </div>
        <div id="video-wrapper" hidden>
          <div id="video-player"></div>
        </div>
      </div>
      
      <!-- URL Input -->
      <div id="url-input-section">
        <div class="input-group">
          <input type="text" id="video-url" 
                 placeholder="Paste YouTube or Vimeo URL..." 
                 autocomplete="off">
          <button id="load-video" class="btn primary">Load Video</button>
        </div>
        <div id="video-info">
          <span id="video-title">No video loaded</span>
          <div id="video-controls">
            <button id="sync-video" class="icon-btn" title="Sync with others">🔄 Sync</button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Participants Section -->
    <div id="participants-section">
      <div id="watch-participants">
        <h3>Participants</h3>
        <div id="participants-list"></div>
      </div>
      
      <!-- Chat Section -->
      <div id="chat-section">
        <div id="chat-messages"></div>
        <div id="chat-input">
          <input type="text" id="message-input" placeholder="Type a message...">
          <button id="send-message" class="btn">Send</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Audio Controls -->
  <div id="watch-controls">
    <button id="watch-mic" class="control-btn" aria-pressed="true" title="Toggle mic">
      <span class="emoji">🎤</span>
      <span class="label">Mute</span>
    </button>
    
    <button id="watch-leave" class="control-btn danger" title="Leave room">
      <span class="emoji">🚪</span>
      <span class="label">Leave</span>
    </button>
  </div>
  
  <!-- Hidden audio elements -->
  <audio id="local-audio" autoplay muted playsinline></audio>
  <audio id="remote-audio" autoplay playsinline></audio>
  
  <!-- Agora RTC SDK -->
  <script src="AgoraRTC_N-4.24.0.js"></script>
  <script src="watch.js"></script>
</body>
</html>
